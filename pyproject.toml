[project]
name = "vectorferry"
version = "0.1.0.dev0"
description = "Move and sync data between vector databases, and prove it arrived intact."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Deepak", email = "deepak.sharma.98@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyarrow>=15",
    "xxhash>=3.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
vf = "vectorferry.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["integration: needs the docker test stack (docker compose -f tests/compose.yml up -d)"]
addopts = "-m 'not integration'"
