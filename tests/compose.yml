# Test stack: three Chroma API generations + Postgres with pgvector.
#   docker compose -f tests/compose.yml up -d
#   uv run pytest -m integration
name: vectorferry-test
services:
  chroma-04:
    image: chromadb/chroma:0.4.24 # /api/v1
    ports: ["18004:8000"]
  chroma-06:
    image: chromadb/chroma:0.6.3 # /api/v1 + /api/v2
    ports: ["18006:8000"]
  chroma-10:
    image: chromadb/chroma:1.0.20 # /api/v2 only
    ports: ["18100:8000"]
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: vf
      POSTGRES_USER: vf
      POSTGRES_DB: vf
    ports: ["15432:5432"]
